<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout log</title>
<meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1c1a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Workouts">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#f7f4ee;--card:#fdfcf9;--text:#2f2d29;--muted:#8d887e;--line:#ebe6dc;
  --accent:#6b7d5f;--accent-ink:#fbfaf5;--accent-soft:#eef0e6;--danger:#b0664c;--chip:#f1ede5;
  --radius:20px;color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1d1c1a;--card:#252421;--text:#ece8e0;--muted:#a19c91;--line:#34322e;
    --accent:#a7b796;--accent-ink:#1d1f19;--accent-soft:#2b3027;--danger:#d88f74;--chip:#2e2c28;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.005em;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:6px;
  padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.ttl{flex:1;min-width:0;text-align:center}
.topbar h1{margin:0;font-size:17px;font-weight:500;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#syncStat{display:block;margin:1px auto 0;border:0;background:none;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;padding:0}
#syncStat[hidden]{display:none}
#syncStat.bad{color:var(--danger)}
.field input{margin-top:2px}
.topbtn{width:44px;height:40px;border:0;background:none;color:var(--text);font-size:22px;border-radius:10px;cursor:pointer}
.topbtn:active{background:var(--chip)}
.topbtn[hidden]{display:block;visibility:hidden}
main{max-width:640px;margin:0 auto;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:0 0 14px}
a{color:inherit}
.muted{color:var(--muted)}
.small{font-size:14px}
.big{font-size:20px;font-weight:500;letter-spacing:.01em}
.sec-h{font-size:11.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.empty{color:var(--muted);text-align:center;padding:18px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;
  border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);
  font:inherit;font-weight:500;letter-spacing:.02em;text-decoration:none;cursor:pointer}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;min-height:54px;font-size:17px;letter-spacing:.05em}
.btn.wide{width:100%}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.add{width:100%;margin-top:10px;border-color:var(--accent);color:var(--accent);background:none}
.btn.link{min-height:auto;padding:8px 0 0;border:0;border-radius:0;background:none;color:var(--accent);font-weight:500}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.start{margin-bottom:12px}
.hero .btn{margin-top:12px}
textarea,input{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);
  border-radius:14px;padding:11px 14px;width:100%}
textarea{resize:vertical;min-height:44px}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:14px;color:var(--muted);margin:0 0 4px 2px}
.wmeta{margin:2px 2px 12px}
/* exercise card */
.ex-head{display:flex;align-items:center;gap:8px}
.exname{flex:1;text-align:left;border:0;background:none;padding:0;font:inherit;font-size:18px;font-weight:500;letter-spacing:.01em;color:var(--text);cursor:pointer;text-decoration:none}
.icon{width:40px;height:40px;flex:none;border:0;background:none;color:var(--muted);font-size:17px;border-radius:10px;cursor:pointer}
.icon:active{background:var(--chip)}
.last{background:var(--accent-soft);border-radius:14px;padding:10px 12px;margin:10px 0 12px;font-size:14px}
.last.new{background:var(--chip);color:var(--muted)}
.last-h{display:flex;justify-content:space-between;gap:8px;color:var(--muted);margin-bottom:4px}
.last-h a{color:var(--accent);text-decoration:none;font-weight:500;white-space:nowrap}
.last-note{margin-top:6px;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:14px;white-space:nowrap}
.set-h,.set{display:grid;grid-template-columns:26px minmax(0,1fr) 14px minmax(0,1fr) 40px;gap:8px;align-items:center}
.set-h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
.set{margin-bottom:6px}
.set .n{text-align:center;font-weight:500;color:var(--muted)}
.set .x{text-align:center;color:var(--muted)}
.unit{position:relative}
.unit input{padding-right:46px;text-align:right;font-weight:500}
.unit input[data-f="r"]:placeholder-shown{border:2px dashed var(--accent);background:var(--card)}
.unit input::placeholder{color:var(--muted);opacity:1}
.unit span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--muted);pointer-events:none}
.xnote{margin-top:10px}
.xnote-view{margin-top:10px;padding:10px 12px;background:var(--chip);border-radius:14px;font-size:15px;white-space:pre-wrap}
/* autocomplete */
.ac{display:flex;gap:8px;margin-top:6px}
.ac input{flex:1}
.suggest{list-style:none;margin:6px 0 0;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--card);
  box-shadow:0 8px 28px rgba(60,50,30,.10)}
.suggest[hidden]{display:none}
.suggest button{display:block;width:100%;text-align:left;padding:11px 12px;border:0;background:none;color:var(--text);font:inherit;border-radius:8px;cursor:pointer}
.suggest button.sel,.suggest button:hover{background:var(--chip)}
.suggest b{color:var(--accent)}
/* lists */
.summary{list-style:none;padding:0;margin:10px 0 12px}
.summary li{display:flex;flex-direction:column;padding:7px 0;border-top:1px solid var(--line)}
.summary li span:first-child{font-weight:600}
.summary li span:last-child{font-size:15px}
.wnote{white-space:pre-wrap;margin-top:10px;padding:10px 12px;background:var(--chip);border-radius:14px;font-size:15px}
a.hist{display:block;text-decoration:none}
.hist-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.month{font-size:11.5px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;margin:18px 4px 8px}
.month:first-child{margin-top:4px}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:999px;font:inherit;font-weight:500;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(60,50,30,.08)}
table.st{border-collapse:collapse;width:100%;margin-top:8px;font-size:15px}
table.st td,table.st th{padding:6px 4px;border-top:1px solid var(--line);text-align:left}
table.st th{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.12em;border-top:0}
table.st td:first-child,table.st th:first-child{width:44px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;z-index:50;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.reminder{border-color:var(--accent)}
p{margin:6px 0}
.card.plan{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;text-decoration:none}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 4px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sec-h + .prow,.pg-h + .prow,.sec-h + .pgroup,.prow + .pgroup,.pgroup + .prow{border-top:0}
.pgroup{border:1px solid var(--accent);border-radius:14px;padding:2px 10px 4px;margin:8px 0}
.pg-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);padding-top:8px}
.icon.on{color:var(--accent);background:var(--accent-soft)}
.icon svg{vertical-align:middle}
.group{border-color:var(--accent)}
.grp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.grp-head .sec-h{color:var(--accent);margin:0}
.gex{padding:10px 0 4px;border-top:1px solid var(--line)}
.grp-head + .gex{border-top:0}
.tag{flex:none;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px}
.set .n.tagn{color:var(--accent);font-size:13px;font-weight:600}
.round-h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px;padding-top:8px;border-top:1px solid var(--line)}
.set-h + .round-h{border-top:0;padding-top:0;margin-top:2px}
.links{display:flex;flex-wrap:wrap;column-gap:20px}
.addex.ss{border-color:var(--accent)}
.pname{font-weight:500;overflow-wrap:anywhere}
.stepper{display:flex;align-items:center}
.stepper span{min-width:54px;text-align:center;font-size:14px;color:var(--muted)}
.pbtns{display:flex}
.icon[disabled]{opacity:.3;pointer-events:none}
.wname{font-size:18px;font-weight:500}
</style>
</head>
<body>
<header class="topbar">
  <button class="topbtn" id="backBtn" aria-label="Back" hidden>‹</button>
  <div class="ttl"><h1 id="title">Workout log</h1><button id="syncStat" hidden></button></div>
  <button class="topbtn" id="setBtn" aria-label="Settings and backup">⚙︎</button>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ---------- storage ---------- */
const KEYS = { p: 'wt.v1.plans', w: 'wt.v1.workouts', a: 'wt.v1.active', b: 'wt.v1.lastBackup', d: 'wt.v1.deleted', au: 'wt.v1.activeUpdated' };
const SK = { tok: 'wt.sync.token', gist: 'wt.sync.gist', name: 'wt.sync.name', last: 'wt.sync.last' };
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function store(k, v) {
  try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); }
  catch (e) { toast('Could not save – storage is unavailable in this browser mode'); }
}
let workouts = load(KEYS.w, []);
let active = load(KEYS.a, null);
let plans = load(KEYS.p, []);            // workout plans: {id, name, updated, exercises:[{name, sets}]}
let planDraft = null;
let ssTarget = null;                     // index of the exercise the next added exercise joins as a superset
let deleted = load(KEYS.d, {});          // id -> time deleted (so deletions sync too)
let activeUpdated = load(KEYS.au, 0);
let draft = null;           // copy of a past workout being edited
let mode = null;            // 'active' | 'edit' while the editor is shown
let timer = null;
let histTab = 'workouts';
const openNotes = new WeakSet();
workouts.sort((a, b) => b.start - a.start);

let persistAsked = false;
function requestPersist() {
  if (persistAsked) return; persistAsked = true;
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}
}
function saveWorkouts() { workouts.sort((a, b) => b.start - a.start); store(KEYS.w, workouts); store(KEYS.d, deleted); requestPersist(); changed(); }
function saveActive() { activeUpdated = Date.now(); store(KEYS.a, active); store(KEYS.au, activeUpdated); requestPersist(); changed(); }
function savePlans() { store(KEYS.p, plans); store(KEYS.d, deleted); requestPersist(); changed(); }
function persist() { if (mode === 'active') saveActive(); }
function cur() { return mode === 'active' ? active : mode === 'edit' ? draft : null; }

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function num(s) {
  if (s == null) return null;
  s = String(s).replace(',', '.').trim();
  if (s === '') return null;
  const n = parseFloat(s);
  return isFinite(n) ? n : null;
}
const nf = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2, useGrouping: false });
const fmt = n => (n == null ? '' : nf.format(n));
const hasW = s => s.w != null && s.w !== 0;
const setText = s => hasW(s) ? `${fmt(s.w)} kg × ${s.r == null ? '–' : s.r}` : `${s.r == null ? '–' : s.r} reps`;
function summarize(sets) { // group consecutive sets with the same weight: "60 kg × 8, 8 · 62.5 kg × 6"
  const groups = [];
  for (const s of sets) {
    const g = groups[groups.length - 1];
    if (g && (g.w || 0) === (s.w || 0)) g.reps.push(s.r); else groups.push({ w: s.w, reps: [s.r] });
  }
  return groups.map(g => g.w ? `${fmt(g.w)} kg × ${g.reps.join(', ')}` : `${g.reps.join(', ')} reps`).join(' · ');
}
const dLong = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const dShort = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
const dMonth = new Intl.DateTimeFormat('en-GB', { month: 'long', year: 'numeric' });
const tFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' });
function dayDiff(ts) {
  const a = new Date(ts); a.setHours(0, 0, 0, 0);
  const b = new Date(); b.setHours(0, 0, 0, 0);
  return Math.round((b - a) / 864e5);
}
function relDay(ts) {
  const d = dayDiff(ts);
  if (d === 0) return 'today';
  if (d === 1) return 'yesterday';
  if (d < 14) return `${d} days ago`;
  if (d < 60) return `${Math.round(d / 7)} weeks ago`;
  return `${Math.round(d / 30)} months ago`;
}
function dur(ms) {
  const m = Math.max(0, Math.round(ms / 60000)), h = Math.floor(m / 60);
  return h ? `${h} h ${m % 60} min` : `${m} min`;
}
const timeRange = w => `${tFmt.format(w.start)}${w.end ? '–' + tFmt.format(w.end) : ''}`;
const workoutDur = w => (w.end ? dur(w.end - w.start) : '');
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------- exercise knowledge ---------- */
function exerciseNames() { // most recently used first, one spelling per name
  const m = new Map();
  for (const w of workouts) for (const e of w.exercises) {
    const k = e.name.toLowerCase(); if (!m.has(k)) m.set(k, e.name);
  }
  return [...m.values()];
}
function canonical(name) {
  name = name.replace(/\s+/g, ' ').trim();
  if (!name) return '';
  const k = name.toLowerCase();
  const hit = exerciseNames().find(n => n.toLowerCase() === k);
  return hit || name.charAt(0).toUpperCase() + name.slice(1);
}
// Last time this exercise was done. With a workout name, prefer the last time in a workout with that name.
function lastPerf(name, beforeTs, skipId, wname) {
  const k = lc(name), wn = lc(wname);
  let any = null;
  for (const w of workouts) {
    if (w.id === skipId) continue;
    if (beforeTs != null && w.start >= beforeTs) continue;
    const e = w.exercises.find(x => lc(x.name) === k);
    if (!e) continue;
    if (!wn) return { w, e };
    if (lc(w.name) === wn) return { w, e, named: true };
    if (!any) any = { w, e };
  }
  return any;
}
const lc = s => (s || '').trim().toLowerCase();
// Supersets: an exercise with ss = true is linked to the exercise before it. Returns groups of indexes.
function blocksOf(ex) {
  const out = [];
  ex.forEach((e, i) => { if (i && e.ss && out.length) out[out.length - 1].push(i); else out.push([i]); });
  return out;
}
const groupWord = n => (n > 2 ? 'Giant set' : 'Superset');
function exList(ex) { return blocksOf(ex).map(b => b.map(i => ex[i].name).join(' + ')).join(' · '); }
function removeAt(ex, i) { // keep the rest of a superset together when one exercise is removed
  if (!ex[i].ss && ex[i + 1] && ex[i + 1].ss) ex[i + 1].ss = false;
  ex.splice(i, 1);
  if (ex[0]) ex[0].ss = false;
}
function moveUp(ex, i) { // within a superset: swap; otherwise move the whole superset above the previous block
  const bs = blocksOf(ex), bi = bs.findIndex(b => b.includes(i)), b = bs[bi];
  if (i > b[0]) { const a = ex[i - 1], c = ex[i]; const fa = a.ss, fc = c.ss; ex[i - 1] = c; ex[i] = a; c.ss = fa; a.ss = fc; return; }
  if (bi === 0) return;
  const moving = ex.splice(b[0], b.length);
  ex.splice(bs[bi - 1][0], 0, ...moving);
  ex.forEach((e, k) => { if (k === 0) e.ss = false; });
}
const LINK_SVG = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
function findPlan(name) { const k = lc(name); return k ? plans.find(p => lc(p.name) === k) || null : null; }
function lastNamed(name) { const k = lc(name); return k ? workouts.find(w => lc(w.name) === k) || null : null; }
function sortedPlans() { return [...plans].sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' })); }
function planFromWorkout(w, id) {
  return { id: id || uid(), name: w.name.trim(), updated: Date.now(), exercises: w.exercises.map((e, i) => ({ name: e.name, sets: Math.max(1, e.sets.length), ss: !!(i && e.ss) })) };
}
// When a named workout is saved: make a plan with that name if none exists (or offer to update it).
function ensurePlan(w, askUpdate) {
  if (!w.name) return null;
  const p = findPlan(w.name);
  if (p) w.name = p.name; // same spelling as the plan
  if (!p) { if (w.exercises.length) { plans.push(planFromWorkout(w)); savePlans(); return 'created'; } return null; }
  const sig = ex => ex.map(e => (e.ss ? '+' : '|') + lc(e.name)).join('');
  const a = sig(p.exercises), b = sig(w.exercises);
  if (askUpdate && w.exercises.length && a !== b &&
      confirm(`Today’s exercises are different from the plan “${p.name}”.\n\nUpdate the plan to today’s exercises?`)) {
    Object.assign(p, planFromWorkout(w, p.id), { name: p.name }); savePlans(); return 'updated';
  }
  return null;
}
// A new workout preloaded with exercises. Sets and weights come from the last workout with this name.
function newWorkoutFrom(name, planEx, lastW = lastNamed(name)) {
  const exercises = planEx.map(pe => {
    const src = lastW && lastW.exercises.find(e => lc(e.name) === lc(pe.name));
    const ref = src || (lastPerf(pe.name, null, null, name) || {}).e;
    const n = Math.max(1, src ? src.sets.length : pe.sets);
    const sets = Array.from({ length: n }, (_, j) => ({
      w: ref && ref.sets.length ? (ref.sets[j] || ref.sets[ref.sets.length - 1]).w : null, r: null }));
    return { name: pe.name, note: '', ss: !!pe.ss, sets };
  });
  return { id: uid(), start: Date.now(), name: name || '', note: '', exercises };
}
function busy() {
  if (!active) return false;
  if (confirm('You already have a workout in progress. Go to it?')) go('/workout');
  return true;
}
function startFromPlan(id) {
  const p = plans.find(x => x.id === id);
  if (!p || busy()) return;
  active = newWorkoutFrom(p.name, p.exercises); saveActive(); go('/workout');
}
function repeatWorkout(id) {
  const w = workouts.find(x => x.id === id);
  if (!w) return;
  const p = findPlan(w.name);
  if (p) return startFromPlan(p.id);
  if (busy()) return;
  active = newWorkoutFrom(w.name || '', w.exercises.map(e => ({ name: e.name, sets: e.sets.length, ss: e.ss })), w);
  saveActive(); go('/workout');
}

/* ---------- routing ---------- */
const backBtn = $('#backBtn'), setBtn = $('#setBtn');
let backPath = null;
function setTop(title, back, showSettings = true) {

function addRound(first) {
  const w = cur(), b = blocksOf(w.exercises).find(x => x[0] === first); if (!b) return;
  for (const i of b) {

  }
  for (const i of b) {
    const e = w.exercises[i], prev = e.sets[e.sets.length - 1];
    let wt = prev ? prev.w : null;
    if (!prev) { const lp = lastPerf(e.name, w.start, w.id, w.name); wt = lp && lp.e.sets[0] ? lp.e.sets[0].w : null; }
    e.sets.push({ w: wt, r: null });

  if (inp) { inp.focus(); inp.scrollIntoView({ block: 'center', behavior: 'smooth' }); }

function addExercise(raw) {
  if (mode === 'plan') return planAddExercise(raw);
  const w = cur(); const name = canonical(raw);
  if (!name) { $('#exname').focus(); return; }
  const lp = lastPerf(name, w.start, w.id, w.name);
  const firstW = lp && lp.e.sets[0] ? lp.e.sets[0].w : null;
  const at = ssTarget != null && w.exercises[ssTarget] ? ssTarget : null;
  ssTarget = null;
  let i;
  if (at != null) { // join a superset: as many sets as the exercise it joins has left
    const left = Math.max(1, w.exercises[at].sets.filter(s => !(s.r > 0)).length);
    i = at + 1;
    w.exercises.splice(i, 0, { name, note: '', ss: true, sets: Array.from({ length: left }, () => ({ w: firstW, r: null })) });
  } else {
    w.exercises.push({ name, note: '', sets: [{ w: firstW, r: null }] });
    i = w.exercises.length - 1;
  }

function addSet(i) {
  const w = cur(), e = w.exercises[i];

    toast(`Fill in reps for set ${e.sets.length} first`);
    return focusSet(i, e.sets.length - 1, 'r');
  }
  let wt = prev ? prev.w : null;
  if (!prev) { const lp = lastPerf(e.name, w.start, w.id, w.name); wt = lp && lp.e.sets[0] ? lp.e.sets[0].w : null; }
  e.sets.push({ w: wt, r: null });

function cleaned(w) {
  const c = JSON.parse(JSON.stringify(w));

  const bid = [];
  blocksOf(c.exercises).forEach((b, k) => b.forEach(i => { bid[i] = k; }));
  const kept = [];
  c.exercises.forEach((e, i) => { if (e.sets.length || e.note) kept.push({ e, b: bid[i] }); });

}

  if (confirm(`${miss.length} set${miss.length > 1 ? 's have' : ' has'} no reps filled in (${names}).\n\nOK = go back and fill them in\nCancel = save without ${miss.length > 1 ? 'them' : 'it'}`)) {
    focusSet(miss[0].i, miss[0].j, 'r');
    return false;
  }

}
function finishWorkout() {
  const chk = checkMissing(active);
  if (!chk) return;
  const c = cleaned(active);
  if (!c.exercises.length && !c.note) {
    if (confirm('Nothing has been logged. Discard this workout?')) { active = null; saveActive(); location.replace('#/'); }
    return;
  }
  if (chk !== 'dropped' && !confirm('Finish and save this workout?')) return;
  c.end = Date.now(); c.updated = Date.now();
  const pl = ensurePlan(c, true);
  workouts.push(c); saveWorkouts();
  active = null; saveActive();
  toast(pl === 'created' ? `Saved – “${c.name}” is now a workout plan` : pl === 'updated' ? 'Workout and plan saved' : 'Workout saved');
  location.replace('#/w/' + c.id);
}
function saveEdit() {
  if (!checkMissing(draft)) return;
  const c = cleaned(draft); c.updated = Date.now();
  const pl = ensurePlan(c, false);
  const idx = workouts.findIndex(x => x.id === c.id);
  if (idx < 0) return;
  workouts[idx] = c; saveWorkouts(); draft = null;
  toast(pl === 'created' ? `Saved – “${c.name}” is now a workout plan` : 'Changes saved');

/* ---------- autocomplete ---------- */
let selIdx = -1;
function suggest() {
  const inp = $('#exname'), ul = $('#suggest'); if (!inp) return;
  const q = inp.value.trim().toLowerCase(); selIdx = -1;
  if (!q) { ul.hidden = true; ul.innerHTML = ''; return; }
  const names = exerciseNames();
  const a = names.filter(n => n.toLowerCase().startsWith(q));
  const b = names.filter(n => { const l = n.toLowerCase(); return !l.startsWith(q) && l.includes(q); });
  const list = [...a, ...b].slice(0, 8);
  if (!list.length) { ul.hidden = true; ul.innerHTML = ''; return; }
  ul.innerHTML = list.map(n => {
    const k = n.toLowerCase().indexOf(q);
    const h = esc(n.slice(0, k)) + '<b>' + esc(n.slice(k, k + q.length)) + '</b>' + esc(n.slice(k + q.length));
    return `<li><button type="button" data-act="pick" data-name="${esc(n)}">${h}</button></li>`;
  }).join('');
  ul.hidden = false;
}
function moveSel(d) {
  const btns = [...document.querySelectorAll('#suggest button')]; if (!btns.length) return;
  selIdx = (selIdx + d + btns.length) % btns.length;
  btns.forEach((b, k) => b.classList.toggle('sel', k === selIdx));
}

/* ---------- history ---------- */
function historyView() {
  setTop('History', '/');
  const seg = `<div class="seg"><button data-act="tab" data-t="workouts" class="${histTab === 'workouts' ? 'on' : ''}">Workouts</button>
    <button data-act="tab" data-t="exercises" class="${histTab === 'exercises' ? 'on' : ''}">Exercises</button></div>`;
  if (!workouts.length) { app.innerHTML = seg + `<p class="empty">No workouts saved yet.</p>`; return; }
  if (histTab === 'exercises') {
    const counts = new Map();
    for (const w of workouts) for (const e of w.exercises) {
      const k = e.name.toLowerCase();
      if (!counts.has(k)) counts.set(k, { name: e.name, n: 0, last: w.start });
      counts.get(k).n++;
    }
    const list = [...counts.values()].sort((a, b) => a.name.localeCompare(b.name));
    app.innerHTML = seg + list.map(x => `
      <a class="card hist" href="#/x/${encodeURIComponent(x.name)}">
        <div class="hist-top"><b>${esc(x.name)}</b><span class="muted small">${x.n}×</span></div>
        <div class="muted small">Last: ${dShort.format(x.last)} (${relDay(x.last)})</div>
      </a>`).join('');
    return;
  }
  let html = seg, month = '';
  for (const w of workouts) {
    const m = dMonth.format(w.start);
    if (m !== month) { html += `<div class="month">${m}</div>`; month = m; }
    html += `
      <a class="card hist" href="#/w/${w.id}">
        <div class="hist-top"><b>${dShort.format(w.start)}${w.name ? ' · ' + esc(w.name) : ''}</b><span class="muted small">${workoutDur(w)}</span></div>
        <div class="muted">${esc(exList(w.exercises) || '—')}</div>

      </a>`;

}

function savePlanDraft() { // returns the saved plan or null
  const p = planDraft, name = p.name.replace(/\s+/g, ' ').trim();

  if (plans.some(x => x.id !== p.id && lc(x.name) === lc(name))) { toast('You already have a plan with that name'); $('#planName').focus(); return null; }
  const orig = plans.find(x => x.id === p.id);
  if (orig && orig.name !== name) { // renamed: keep past workouts linked to the plan
    let n = 0;
    workouts.forEach(w => { if (lc(w.name) === lc(orig.name)) { w.name = name; w.updated = Date.now(); n++; } });

  const saved = { id: p.id, name, updated: Date.now(), exercises: p.exercises };
  if (orig) Object.assign(orig, saved); else plans.push(saved);
  savePlans(); planDraft = null;

function exportBackup() {

  try { await navigator.share({ files: [file], title: 'Workout backup' }); store(KEYS.b, Date.now()); settings(); toast('Backup shared'); }
  catch (e) { if (e && e.name !== 'AbortError') exportBackup(); }

function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      const arr = Array.isArray(d) ? d : d.workouts;
      if (!Array.isArray(arr)) throw new Error('bad');
      const have = new Set(workouts.map(w => w.id));
      let added = 0;
      for (const w of arr) {
        if (!w || typeof w.start !== 'number' || !Array.isArray(w.exercises)) continue;
        if (!w.id) w.id = uid();
        if (have.has(w.id)) continue;
        workouts.push({
          id: w.id, start: w.start, end: w.end || null, updated: Date.now(), name: w.name || '', note: w.note || '',
          exercises: w.exercises.filter(e => e && e.name).map(e => ({
            name: String(e.name), note: e.note || '', ss: !!e.ss,
            sets: (e.sets || []).map(s => ({ w: num(s.w), r: num(s.r) })).filter(s => s.r != null)
          }))
        });
        have.add(w.id); added++;
      }
      const havePlans = new Set(plans.map(x => x.id));
      for (const pl of (Array.isArray(d.plans) ? d.plans : [])) {
        if (!pl || !pl.id || !pl.name || havePlans.has(pl.id) || findPlan(pl.name)) continue;
        plans.push(normP({ ...pl, updated: Date.now() })); havePlans.add(pl.id);
      }
      savePlans();
      saveWorkouts(); settings();
      toast(added ? `Imported ${added} workout${added > 1 ? 's' : ''}` : 'Nothing new in that file');
    } catch (e) { toast('That doesn’t look like a workout backup file'); }
  };
  r.readAsText(file);
}

app.addEventListener('input', ev => {

  const f = t.dataset.f; const w = cur(); if (!f || !w) return;
  if (f === 'wnote') w.note = t.value;
  else if (f === 'wname') w.name = t.value;
  else {
    const e = w.exercises[+t.dataset.e]; if (!e) return;
    if (f === 'xnote') e.note = t.value;
    else {
      const s = e.sets[+t.dataset.s]; if (!s) return;
      if (f === 'w') { // later sets not done yet follow this set's weight
        const old = s.w, j = +t.dataset.s; s.w = num(t.value);
        e.sets.forEach((o, k) => {
          if (k > j && !(o.r > 0) && o.w === old) {
            o.w = s.w;
            const inp = $(`input[data-f="w"][data-e="${t.dataset.e}"][data-s="${k}"]`); if (inp) inp.value = fmt(o.w);
          }

      if (f === 'r') { const r = num(t.value); s.r = r == null ? null : Math.round(r); }
    }
  }
  persist();
});

function normP(p) {

    exercises: (p.exercises || []).filter(e => e && e.name).map(e => ({ name: String(e.name), sets: Math.max(1, +e.sets || 1), ss: !!e.ss })) };
}
function normData(d) {

  const a = d.active || {};
  return {
    workouts: (d.workouts || []).filter(w => w && w.id && w.start).map(normW),
    plans: (d.plans || []).filter(p => p && p.id && p.name).map(normP),
    deleted: { ...(d.deleted || {}) },
    active: { updated: +a.updated || 0, w: a.w ? normW(a.w) : null }
  };
}
const localData = () => normData({ workouts, plans, deleted, active: { updated: activeUpdated, w: active } });
function canon(d) {
  const ws = [...d.workouts].sort((a, b) => (a.id < b.id ? -1 : 1));
  const del = Object.keys(d.deleted).sort().map(k => [k, d.deleted[k]]);
  const ps = [...d.plans].sort((a, b) => (a.id < b.id ? -1 : 1));
  return JSON.stringify([ws, del, d.active, ps]);
}
function mergeData(A, B) {
  const del = { ...A.deleted };
  for (const [k, v] of Object.entries(B.deleted)) del[k] = Math.max(del[k] || 0, v);
  const m = new Map();
  for (const w of [...A.workouts, ...B.workouts]) {
    const o = m.get(w.id);
    if (!o || w.updated > o.updated) m.set(w.id, w);
  }
  const ws = [...m.values()].filter(w => !(del[w.id] >= w.updated)).sort((a, b) => b.start - a.start);
  const pm = new Map();
  for (const p of [...A.plans, ...B.plans]) { const o = pm.get(p.id); if (!o || p.updated > o.updated) pm.set(p.id, p); }
  const ps = [...pm.values()].filter(p => !(del[p.id] >= p.updated));
  let act = B.active.updated > A.active.updated ? B.active : A.active;
  if (act.w && (m.has(act.w.id) || del[act.w.id])) act = { updated: act.updated, w: null }; // finished/deleted elsewhere
  return { workouts: ws, plans: ps, deleted: del, active: act };
}
function applyData(d) {
  workouts = d.workouts; plans = d.plans; deleted = d.deleted; active = d.active.w; activeUpdated = d.active.updated;
  store(KEYS.p, plans); store(KEYS.w, workouts); store(KEYS.d, deleted); store(KEYS.a, active); store(KEYS.au, activeUpdated);
}

async function gh(path, opts = {}) {
  const headers = { Authorization: 'Bearer ' + load(SK.tok, ''), Accept: 'application/vnd.github+json' };
  if (opts.body) headers['Content-Type'] = 'application/json';
  const r = await fetch('https://api.github.com' + path, { ...opts, headers, cache: 'no-store' });
  if (!r.ok) { const e = new Error('GitHub ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function findOrCreateGist() {
  const desc = gistDesc();
  for (let page = 1; page <= 10; page++) {
    const list = await gh(`/gists?per_page=100&page=${page}`);
    const hit = list.find(g => g.description === desc && g.files && g.files[GIST_FILE]);
    if (hit) return hit.id;
    if (list.length < 100) break;
  }
  const empty = { app: 'workout-log', version: 2, workouts: [], plans: [], deleted: {}, active: { updated: 0, w: null } };
  const g = await gh('/gists', { method: 'POST', body: JSON.stringify({ description: desc, public: false, files: { [GIST_FILE]: { content: JSON.stringify(empty) } } }) });
  return g.id;
}
async function readRemote(id) {
  const g = await gh('/gists/' + id);
  const f = g.files && g.files[GIST_FILE];
  if (!f) return normData({});
  let txt = f.content;
  if (f.truncated) txt = await (await fetch(f.raw_url, { cache: 'no-store' })).text();
  try { return normData(JSON.parse(txt)); } catch (e) { return normData({}); }
}
async function sync() {
  if (!syncOn()) return setSync('off');
  if (syncing) { again = true; return; }
  syncing = true; clearTimeout(retryT); clearTimeout(pushT);
  if (syncState !== 'ok' && syncState !== 'pending') setSync('syncing');
  try {
    if (!gistId) { gistId = await findOrCreateGist(); store(SK.gist, gistId); }
    const remote = await readRemote(gistId);
    const merged = mergeData(localData(), remote);
    if (canon(merged) !== canon(remote)) {
      const body = { app: 'workout-log', version: 2, saved: new Date().toISOString(), ...merged };
      await gh('/gists/' + gistId, { method: 'PATCH', body: JSON.stringify({ files: { [GIST_FILE]: { content: JSON.stringify(body) } } }) });
    }
    const before = localData();
    const final = mergeData(before, merged);            // keeps edits made while we were waiting
    if (canon(final) !== canon(before)) { applyData(final); refreshView(); }
    if (canon(final) !== canon(merged)) again = true;   // something changed locally meanwhile – push it
    store(SK.last, Date.now()); syncErr = '';
    setSync(again ? 'pending' : 'ok');
  } catch (e) {
    if (e.status === 404 && gistId) { gistId = null; store(SK.gist, null); again = true; }
    else if (e.status === 401 || e.status === 403) { syncErr = 'GitHub refused the token – check it in Settings'; setSync('auth'); }
    else { syncErr = 'Could not reach GitHub – retrying'; setSync('offline'); retryT = setTimeout(sync, 60000); }
  } finally {
    syncing = false;
    if (again) { again = false; setTimeout(sync, 300); }
  }
}
function changed() {
  if (!syncOn()) return;
  setSync('pending');
  clearTimeout(pushT); pushT = setTimeout(sync, 3000);
}
function setSync(st) {
  syncState = st;
  const el = $('#syncStat');
  if (!el) return;
  if (st === 'off') { el.hidden = true; return; }
  el.hidden = false;
  el.classList.toggle('bad', st === 'auth' || st === 'offline');
  const last = load(SK.last, 0);
  el.textContent = st === 'syncing' ? 'Syncing…'
    : st === 'pending' ? 'Saving to sync…'
    : st === 'ok' ? `Synced ${tFmt.format(last)}`
    : st === 'auth' ? 'Sync problem – tap for settings'
    : 'Offline – will retry';
  if (mode === null && location.hash === '#/settings') { const s = $('#syncMsg'); if (s) s.textContent = syncErr || el.textContent; }
}
function refreshView() {
  const f = document.activeElement;
  if (f && app.contains(f) && /INPUT|TEXTAREA/.test(f.tagName)) return; // don't yank the screen while typing
  const y = window.scrollY; route(); window.scrollTo(0, y);
}
function syncSection() {
  if (syncOn()) {
    return `<section class="card">
      <div class="sec-h">Sync between devices</div>
      <p>Syncing as <b>${esc(load(SK.name, ''))}</b>. Workouts sync automatically to a secret Gist on GitHub.</p>
      <p class="small muted" id="syncMsg">${esc(syncErr || $('#syncStat').textContent)}</p>
      <div class="row" style="margin-top:8px">
        <button class="btn primary" data-act="ssync">Sync now</button>
        <button class="btn" data-act="soff">Turn off sync</button>
      </div>
      <p class="small muted">Turning sync off keeps the workouts on this device.</p>
    </section>
    <section class="card">
      <div class="sec-h">Set up another device or home-screen app</div>
      <p class="small">Make a link and open it on the other device – it connects with no GitHub login needed there.
        Keep your own name for your other devices. Use another name (e.g. your partner’s) to give that person their own separate log.</p>
      <label class="field"><span>Name on that device</span><input id="linkName" value="${esc(load(SK.name, ''))}" autocapitalize="words"></label>
      <div class="row">
        ${navigator.share ? `<button class="btn primary" data-act="lshare">Send link…</button>` : ''}
        <button class="btn ${navigator.share ? '' : 'primary'}" data-act="lcopy">Copy link</button>
      </div>
      <p class="small muted">The link contains your sync token, so only send it to people you trust.</p>
    </section>`;
  }
  return `<section class="card">
    <div class="sec-h">Got a setup link?</div>
    <p class="small">Paste the link you were sent here to connect this device – no GitHub account needed.</p>
    <div class="ac"><input id="setupPaste" placeholder="Paste link" autocapitalize="off" spellcheck="false">
      <button class="btn primary" data-act="spaste">Connect</button></div>
  </section>
  <section class="card">
    <div class="sec-h">Sync between devices</div>
    <p class="small">Keeps your workouts in step between your phone and laptop, using a secret Gist on GitHub. Each name gets its own log, so two people can share one token without mixing workouts.</p>
    <label class="field"><span>Your name</span><input id="syncName" value="${esc(load(SK.name, ''))}" placeholder="e.g. Patrick" autocapitalize="words"></label>
    <label class="field"><span>GitHub token (needs only the “gist” permission)</span>
      <input id="syncTok" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ghp_…"></label>
    <p class="small"><a href="${TOKEN_URL}" target="_blank" rel="noopener">Create a token on GitHub ›</a></p>
    <button class="btn primary wide" data-act="son">Connect</button>
    <p class="small muted" id="syncMsg"></p>
  </section>`;
}
async function connectSync() {
  const name = $('#syncName').value.trim(), tok = $('#syncTok').value.trim();
  const msg = $('#syncMsg');
  if (!name || !tok) { msg.textContent = 'Fill in both your name and the token.'; return; }
  if (name !== load(SK.name, '')) { store(SK.gist, null); gistId = null; }
  store(SK.name, name); store(SK.tok, tok);
  msg.textContent = 'Connecting…';
  await sync();
  if (syncState === 'auth' || syncState === 'offline') {
    const st = syncState;
    clearTimeout(retryT); store(SK.tok, null); setSync('off');
    msg.textContent = st === 'auth' ? 'GitHub didn’t accept that token. Check that you copied all of it and ticked “gist”.' : 'Could not reach GitHub. Check your connection and try again.';
    return;
  }
  toast('Sync is on'); settings();
}
function setupLink(name) {
  const code = btoa(encodeURIComponent(JSON.stringify({ n: name, t: load(SK.tok, '') })));
  return location.href.split('#')[0] + '#setup=' + code;
}
async function sendLink(how) {
  const name = $('#linkName').value.trim();
  if (!name) { toast('Type a name first'); return; }
  const url = setupLink(name);
  if (how === 'share') {
    try { await navigator.share({ title: 'Workout log', text: `Tap to set up the workout log for ${name}:`, url }); } catch (e) {}
    return;
  }
  try { await navigator.clipboard.writeText(url); toast('Link copied'); }
  catch (e) { prompt('Copy this link:', url); }
}
function applySetupCode(code) { // returns true if this device is now set up
  let d;
  try { d = JSON.parse(decodeURIComponent(atob(code.trim()))); } catch (e) { d = null; }
  if (!d || !d.n || !d.t) { toast('That setup link is broken – try copying it again'); return false; }
  if (load(SK.tok, '') === d.t && load(SK.name, '') === d.n) { toast(`Already set up for ${d.n}`); return true; }
  if (!confirm(`Set up the workout log on this device for “${d.n}”?`)) return false;
  if (d.n !== load(SK.name, '')) { store(SK.gist, null); gistId = null; }
  store(SK.name, d.n); store(SK.tok, d.t);
  toast(`Set up for ${d.n} – syncing`);
  return true;
}
function handleSetupLink() {
  const m = location.hash.match(/^#setup=(.+)$/);
  if (!m) return;
  window.history.replaceState(null, '', location.href.split('#')[0] + '#/');
  applySetupCode(m[1]);
}
function pasteSetup() {
  const v = $('#setupPaste').value;
  const m = v.match(/#setup=([A-Za-z0-9+/=]+)/);
  if (!m) { $('#syncMsg').textContent = 'Paste the whole link you were sent (it contains “#setup=”).'; return; }
  if (applySetupCode(m[1])) { sync().then(settings); }
}
function initSync() {
  $('#syncStat').onclick = () => (syncState === 'auth' ? go('/settings') : sync());
  if (syncOn()) { setSync('syncing'); sync(); } else setSync('off');
  document.addEventListener('visibilitychange', () => {
    if (!syncOn()) return;
    if (document.visibilityState === 'visible') sync();                       // pull what the other device did
    else if (syncState === 'pending') { clearTimeout(pushT); sync(); }        // leaving the app – push now
  });
  window.addEventListener('online', () => syncOn() && sync());
}

route();
if ('serviceWorker' in navigator) { // the app is online-only; remove any old offline cache so updates show at once
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
}
initSync();
</script>
</body>
